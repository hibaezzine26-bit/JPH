

services:
  # ==========================================
  # Service 1 : Base de données MySQL
  # ==========================================
  db:
    image: mysql:8.0
    container_name: jph-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pdr_reporting_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jph-network

  # ==========================================
  # Service 2 : Backend Spring Boot
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jph-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/pdr_reporting_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jph-network

  # ==========================================
  # Service 3 : Frontend React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jph-frontend
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - jph-network

volumes:
  mysql_data:

networks:
  jph-network:
    driver: bridge
